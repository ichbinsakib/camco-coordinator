[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "camco-coordinator"
version = "0.1.0"
description = "CAMCO Coordinator - manufacturing coordination and expediting desktop application"
requires-python = ">=3.12"
readme = "README.md"
authors = [{ name = "CAMCO Manufacturing" }]

dependencies = [
    "PySide6>=6.9,<7.0",
    "SQLAlchemy>=2.0.30,<3.0",
    "alembic>=1.13,<2.0",
    "openpyxl>=3.1,<4.0",
    "pandas>=2.2,<3.0",
    "python-dateutil>=2.9,<3.0",
    "reportlab>=4.1,<5.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-qt>=4.4", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pyinstaller>=6.6"]

[project.gui-scripts]
camco-coordinator = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
ignore_missing_imports = true
